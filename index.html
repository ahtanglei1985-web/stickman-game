<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>热血火柴人：无限激斗 CyberVer 2026 Ultimate</title>
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-pink: #ff007f;
            --neon-purple: #bd00ff;
            --neon-gold: #ffaa00;
            --bg-dark: #05050a;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-dark);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Courier New', Courier, monospace, system-ui;
            user-select: none; -webkit-user-select: none;
        }
        #gameWrapper {
            position: relative;
            box-shadow: 0 0 60px rgba(0, 255, 242, 0.15), inset 0 0 20px rgba(255, 0, 127, 0.1);
            border: 2px solid rgba(0, 255, 242, 0.3);
            border-radius: 12px; overflow: hidden;
            background: #000;
        }
        canvas { display: block; }
        
        /* 赛博朋克高端UI流线覆盖层 */
        .overlay-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(5, 5, 12, 0.98) 0%, rgba(12, 5, 20, 0.95) 100%);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: #fff; z-index: 10; opacity: 1;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s;
        }
        .overlay-menu.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
        
        .menu-title {
            font-size: 46px; font-weight: 900; letter-spacing: 8px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 40px; text-shadow: 0 0 30px rgba(0,255,255,0.4);
            animation: cyberGlitch 3s infinite linear;
        }
        @keyframes cyberGlitch {
            0%, 100% { transform: skewX(0deg); }
            5% { transform: skewX(2deg) scaleY(1.05); }
            10% { transform: skewX(-2deg); }
            15% { transform: skewX(0deg); }
        }
        
        .btn {
            background: rgba(0, 255, 242, 0.03);
            border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 14px 40px; font-size: 16px; font-weight: bold;
            cursor: pointer; border-radius: 4px; margin: 12px;
            letter-spacing: 3px; position: relative; overflow: hidden;
            transition: all 0.2s ease-out; text-shadow: 0 0 5px var(--neon-cyan);
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }
        .btn:hover {
            background: var(--neon-cyan); color: #000;
            box-shadow: 0 0 30px rgba(0,255,242,0.6); text-shadow: none;
            transform: translateY(-2px);
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.4s;
        }
        .btn:hover::before { left: 100%; }

        .char-select-box { display: flex; gap: 20px; margin-bottom: 40px; }
        .char-card {
            border: 2px solid rgba(255,255,255,0.08); padding: 20px 15px;
            border-radius: 6px; cursor: pointer; text-align: center; width: 120px;
            background: rgba(255,255,255,0.01); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }
        .char-card:hover { border-color: var(--neon-pink); transform: translateY(-8px); background: rgba(255,0,127,0.04); }
        .char-card.selected { border-color: var(--neon-cyan); background: rgba(0,255,242,0.08); box-shadow: 0 0 25px rgba(0,255,242,0.25); }
        .char-name { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .char-desc { font-size: 11px; color: #8a8a9e; line-height: 1.4; }

        #ctrlInfo {
            position: absolute; bottom: 15px; color: rgba(255,255,255,0.25);
            font-size: 11px; text-align: center; width: 100%; pointer-events: none;
            letter-spacing: 1px; line-height: 1.6; z-index: 1;
        }

        /* 移动端无冲突虚拟触控层配置 */
        .touch-container {
            position: absolute; bottom: 30px; width: 100%;
            display: none; justify-content: space-between; padding: 0 40px;
            box-sizing: border-box; pointer-events: none; z-index: 8;
        }
        .touch-group { display: grid; gap: 15px; pointer-events: auto; }
        .left-dir { grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); }
        .vbtn-u { grid-column: 2; grid-row: 1; }
        .vbtn-l { grid-column: 1; grid-row: 2; }
        .vbtn-d { grid-column: 2; grid-row: 2; }
        .vbtn-r { grid-column: 3; grid-row: 2; }
        .right-act { grid-template-columns: repeat(2, 65px); grid-template-rows: repeat(2, 65px); margin-top: -20px; }

        /* 高级街机虚拟按键质感 */
        .v-btn {
            background: rgba(0, 255, 242, 0.05); border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan); border-radius: 50%; font-weight: bold; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 5px var(--neon-cyan); box-shadow: 0 0 15px rgba(0,255,255,0.1);
            touch-action: none; user-select: none; -webkit-user-select: none;
            transition: background 0.1s, transform 0.05s;
        }
        .v-btn:active { background: var(--neon-cyan) !important; color: #000 !important; box-shadow: 0 0 30px var(--neon-cyan); transform: scale(0.92); }
        .v-btn.pink { border-color: var(--neon-pink); color: var(--neon-pink); background: rgba(255, 0, 127, 0.05); text-shadow: 0 0 5px var(--neon-pink); box-shadow: 0 0 15px rgba(255,0,127,0.1); }
        .v-btn.pink:active { background: var(--neon-pink) !important; color: #000 !important; box-shadow: 0 0 30px var(--neon-pink); }
        .v-btn.purple { border-color: var(--neon-purple); color: var(--neon-purple); background: rgba(189, 0, 255, 0.08); text-shadow: 0 0 5px var(--neon-purple); box-shadow: 0 0 20px rgba(189,0,255,0.15); font-size: 15px; }
        .v-btn.purple:active { background: var(--neon-purple) !important; color: #000 !important; box-shadow: 0 0 35px var(--neon-purple); }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <!-- 主菜单界面 -->
        <div id="mainMenu" class="overlay-menu">
            <div class="menu-title">CYBER INFINITY: 2026</div>
            <button class="btn" onclick="switchMenu('selectScreen')">CORE CONNECT</button>
        </div>

        <!-- 角色与模式选择界面 -->
        <div id="selectScreen" class="overlay-menu hidden">
            <div style="font-size: 18px; margin-bottom: 20px; color:var(--neon-cyan); letter-spacing:3px; text-shadow: 0 0 10px rgba(0,255,255,0.3)">[ SELECT ENFORCER ]</div>
            <div class="char-select-box" id="p1SelectBox"></div>
            
            <div style="font-size: 18px; margin-bottom: 20px; color:var(--neon-pink); letter-spacing:3px; text-shadow: 0 0 10px rgba(255,0,127,0.3)">[ PROTOCOL MODE ]</div>
            <div style="display: flex;">
                <button class="btn" onclick="startGame(1)">1P vs COMPUTER</button>
                <button class="btn" style="border-color:var(--neon-pink); color:var(--neon-pink); text-shadow: 0 0 5px var(--neon-pink)" onclick="startGame(2)">LOCAL P1 vs P2</button>
            </div>
        </div>

        <!-- 游戏结算界面 -->
        <div id="gameOverScreen" class="overlay-menu hidden">
            <div class="menu-title" id="winnerText" style="text-align: center; line-height: 1.3;">SYSTEM OVERRIDE</div>
            <button class="btn" onclick="switchMenu('selectScreen')">REBOOT BATTLE</button>
        </div>

        <!-- 外设操作映射可视化 -->
        <div id="ctrlInfo">
            P1: [A/D] 移动 | [W] 跳跃 | [S] 防御 | [J] 轻拳 | [K] 重踢 | [L] 聚能充能 | [I] 终结奥义<br>
            P2: [←/→] 移动 | [↑] 跳跃 | [↓] 防御 | [1] 轻拳 | [2] 重踢 | [3] 聚能充能 | [4] 终结奥义
        </div>

        <!-- 纯净防冲突多点触控虚拟面板 -->
        <div id="touchOverlay" class="touch-container">
            <div class="touch-group left-dir">
                <div class="v-btn vbtn-u" id="vb-u">▲</div>
                <div class="v-btn vbtn-l" id="vb-l">◀</div>
                <div class="v-btn vbtn-d" id="vb-d">▼</div>
                <div class="v-btn vbtn-r" id="vb-r">▶</div>
            </div>
            <div class="touch-group right-act">
                <div class="v-btn pink" id="vb-punch">拳</div>
                <div class="v-btn purple" id="vb-ult">奥义</div>
                <div class="v-btn pink" id="vb-kick">踢</div>
                <div class="v-btn" id="vb-charge">聚能</div>
            </div>
        </div>

        <canvas id="battleCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById('battleCanvas');
const ctx = canvas.getContext('2d');

// 高清显示适配支持
const WIDTH = 1024;
const HEIGHT = 576;
canvas.width = WIDTH;
canvas.height = HEIGHT;

const TWO_PI = Math.PI * 2;
const GROUND_Y = HEIGHT - 100;

// 全局控制核心数据
let p1 = null, p2 = null;
let currentMode = 1; 
let gameState = 'menu'; 

// 视觉震撼特效池
let shakeTime = 0, shakeIntensity = 0;
let globalTime = 0, timeScale = 1, lastTime = 0;
let hitStopFrames = 0; // 精准打击定格帧机制
let particles = [], hitFlashes = [], projectiles = [], cyberLines = [];

// 精密防卡死键盘按键池
const keys = {};
window.addEventListener('keydown', e => { 
    const k = e.key.toLowerCase();
    keys[k] = true;
    // 防止空格、方向键触发网页滚动干扰战斗进程
    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 角色引擎多属性深度特化数值
const CHARACTER_ROSTER = {
    gale: { name: "GALE (疾风斩)", color: "#00ffff", trailColor: "rgba(0,255,255,0.18)", maxHp: 100, speed: 6.2, pDmg: 5, kDmg: 11, desc: "霓虹极速刺客型\n特色：物理近战极快，终结技全屏闪掠残影" },
    crimson: { name: "CRIMSON (爆炎拳)", color: "#ff007f", trailColor: "rgba(255,0,127,0.18)", maxHp: 110, speed: 5.0, pDmg: 7, kDmg: 13, desc: "重核等离子输出型\n特色：挥拳附带爆炎重粒子炮流星" },
    shadow: { name: "SHADOW (暗影刃)", color: "#bd00ff", trailColor: "rgba(189,0,255,0.18)", maxHp: 95, speed: 6.8, pDmg: 4, kDmg: 10, desc: "虚空相位幽灵型\n特色：滑踢能瞬间射出多段相位回旋标" },
    titan: { name: "TITAN (泰坦重装)", color: "#ffaa00", trailColor: "rgba(255,170,0,0.18)", maxHp: 140, speed: 3.8, pDmg: 11, kDmg: 20, desc: "赛博重型机械防线\n特色：基础抗性极高，重腿可强行穿透格挡" }
};
let selectedP1Type = 'gale';

// 注入赛博风选人卡片
const p1Box = document.getElementById('p1SelectBox');
Object.keys(CHARACTER_ROSTER).forEach((key) => {
    const char = CHARACTER_ROSTER[key];
    const card = document.createElement('div');
    card.className = `char-card ${key === selectedP1Type ? 'selected' : ''}`;
    card.onclick = () => {
        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedP1Type = key;
    };
    card.innerHTML = `<div class="char-name" style="color:${char.color}">${char.name.split(' ')[0]}</div><div class="char-desc">${char.desc.replace('\n','<br>')}</div>`;
    p1Box.appendChild(card);
});

function switchMenu(targetId) {
    document.querySelectorAll('.overlay-menu').forEach(m => m.classList.add('hidden'));
    document.getElementById(targetId).classList.remove('hidden');
    document.getElementById('touchOverlay').style.display = 'none';
    if (targetId === 'selectScreen') gameState = 'select';
}

function startGame(mode) {
    currentMode = mode;
    document.querySelectorAll('.overlay-menu').forEach(m => m.classList.add('hidden'));
    
    // 智能判别设备环境，移动端自动开启多点防冲突触控
    if('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.getElementById('touchOverlay').style.display = 'flex';
    }
    
    const p1Config = CHARACTER_ROSTER[selectedP1Type];
    const p2Types = Object.keys(CHARACTER_ROSTER);
    // 电脑随机选人，双人对战默认选择不同款
    const p2Type = currentMode === 1 ? p2Types[Math.floor(Math.random() * p2Types.length)] : (selectedP1Type === 'gale' ? 'crimson' : 'gale');
    const p2Config = CHARACTER_ROSTER[p2Type];

    p1 = new Stickman(260, GROUND_Y, p1Config, 1, true, 'p1');
    p2 = new Stickman(WIDTH - 260, GROUND_Y, p2Config, -1, currentMode === 2, 'p2');
    
    // 重置物理实体缓冲池
    particles = []; hitFlashes = []; projectiles = []; cyberLines = [];
    for(let i=0; i<15; i++) {
        cyberLines.push({ x: Math.random()*WIDTH, y: Math.random()*GROUND_Y, len: Math.random()*80+40, speed: Math.random()*4+2 });
    }
    gameState = 'battle';
}

// 粒子爆发动画发生器
function spawnParticle(x, y, color, count = 8, speed = 6) {
    if (particles.length > 500) return;
    for(let i = 0; i < count; i++) {
        const angle = Math.random() * TWO_PI;
        const s = Math.random() * speed + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * s,
            vy: Math.sin(angle) * s - Math.random() * 3,
            life: 1.0, decay: Math.random() * 0.04 + 0.02,
            color, size: Math.random() * 5 + 2
        });
    }
}

function triggerShake(intensity, duration) {
    shakeIntensity = intensity; shakeTime = duration;
}

// 远程高粒子等离子束炮/手里剑
class Projectile {
    constructor(x, y, vx, vy, color, type, owner) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.type = type; this.owner = owner; 
        this.alive = true; this.size = type === 'fireball' ? 14 : 8;
        this.lifeTime = 0;
    }
    update(dt) {
        this.lifeTime += dt;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        if (this.x < -20 || this.x > WIDTH + 20) this.alive = false;
        
        // 飞行时在尾部产生离子推进烟雾
        if (Math.random() > 0.3) {
            particles.push({
                x: this.x, y: this.y + (Math.random()-0.5)*10,
                vx: -this.vx * 0.2, vy: (Math.random()-0.5)*2,
                life: 0.6, decay: 0.05, color: this.color, size: Math.random()*3+1
            });
        }
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 20; ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.globalCompositeOperation = 'screen';
        
        if (this.type === 'fireball') {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, TWO_PI);
            ctx.fill();
            // 内核强白光核心
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size*0.5, 0, TWO_PI); ctx.fill();
        } else { 
            // 炫酷回旋相位镖
            ctx.translate(this.x, this.y);
            ctx.rotate(this.lifeTime * 0.4);
            ctx.fillRect(-this.size, -this.size, this.size*2, this.size*2);
            ctx.fillRect(-this.size*1.5, -this.size*0.3, this.size*3, this.size*0.6);
        }
        ctx.restore();
    }
}

// 核心格斗体控制架构
class Stickman {
    constructor(x, y, config, direction, isControlled, id) {
        this.id = id; this.x = x; this.y = y;
        this.name = config.name;
        this.type = Object.keys(CHARACTER_ROSTER).find(key => CHARACTER_ROSTER[key].name === config.name);
        this.color = config.color; this.trailColor = config.trailColor;
        this.maxHp = config.maxHp; this.hp = config.maxHp;
        this.displayHp = config.maxHp; // 具有生命条红血缓动动画
        this.baseSpeed = config.speed;
        this.pDmg = config.pDmg; this.kDmg = config.kDmg;
        this.dir = direction; this.isControlled = isControlled; 
        
        this.energy = 0;
        this.state = 'idle'; this.stateTimer = 0;
        
        // 核心解耦修复：分离物理碰撞与飞行物爆发的判定状态锁，彻底解决连段卡死Bug
        this.hasHitPhysical = false; 
        this.hasSpawnedProjectile = false; 
        
        this.vx = 0; this.vy = 0;
        this.animPose = 0;
        this.history = []; 
    }

    update(dt) {
        this.stateTimer += dt;

        // 维持高级镜像残影队列
        this.history.push({ x: this.x, y: this.y, state: this.state, timer: this.stateTimer });
        if(this.history.length > 8) this.history.shift();

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        
        // 赛博风摩擦阻尼：使位移手感更平滑且具有瞬发爆发性
        this.vx *= Math.pow(0.82, dt);

        // 竞技场地双侧流形空气阻格墙
        if (this.x < 50) this.x = 50;
        if (this.x > WIDTH - 50) this.x = WIDTH - 50;

        // 重力演算
        if (this.y < GROUND_Y) {
            this.vy += 0.85 * dt;
        } else {
            this.y = GROUND_Y; this.vy = 0;
        }

        if (this.hp <= 0 && this.state !== 'dead') this.setState('dead');

        // 有限状态机逻辑处理核心
        switch(this.state) {
            case 'idle': 
                this.animPose = Math.sin(globalTime * 0.006) * 0.5 + 0.5; 
                break;
            case 'walk': 
                this.animPose = globalTime * 0.015; 
                break;
            case 'dash':
                this.vx = this.dir * 26;
                if(this.stateTimer > 8) this.setState('idle');
                break;
            case 'punch': 
                if(this.stateTimer > 10) this.setState('idle'); 
                break;
            case 'kick': 
                if(this.stateTimer > 14) this.setState('idle'); 
                break;
            case 'block': 
                this.vx = -this.dir * 0.3; 
                break;
            case 'jb': // 聚能状态
                this.vx = -this.dir * 0.1;
                this.energy = Math.min(100, this.energy + 1.8 * dt);
                // 充能随时间喷射粒子
                if (Math.random() > 0.6) spawnParticle(this.x, this.y - 45, this.color, 2, 2);
                break;
            case 'ult':
                if(this.type === 'gale') this.vx = this.dir * 50; // 瞬步斩
                else this.vx = this.dir * 14;
                if(this.stateTimer > 20) this.setState('idle');
                break;
            case 'hit': 
                if(this.stateTimer > 12) this.setState('idle'); 
                break;
        }

        // 血条平缓缓动衰减机制
        if (this.displayHp > this.hp) {
            this.displayHp -= (this.displayHp - this.hp) * 0.1 * dt;
        }
    }

    setState(newState) {
        if (this.state === 'dead') return;
        this.state = newState; 
        this.stateTimer = 0; 
        this.hasHitPhysical = false; 
        this.hasSpawnedProjectile = false; // 切换动作时立即重置触发器，允许新连段
    }

    drawTrails() {
        this.history.forEach((pos, idx) => {
            if (pos.state === 'dash' || pos.state === 'ult' || pos.state === 'kick') {
                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.scale(this.dir, 1);
                ctx.globalAlpha = (idx / this.history.length) * 0.22;
                ctx.globalCompositeOperation = 'screen';
                this.drawSkeleton(this.trailColor, 4, pos.timer, pos.state);
                ctx.restore();
            }
        });
        ctx.globalAlpha = 1.0;
    }

    draw() {
        this.drawTrails();

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.dir, 1);
        
        // 根据状态切换动态霓虹辉光
        ctx.shadowBlur = (this.state === 'ult' || this.state === 'jb') ? 30 : 6;
        ctx.shadowColor = this.color;

        this.drawSkeleton(this.color, 5, this.stateTimer, this.state);
        ctx.restore();
    }

    // 骨架高级艺术渲染管线，融入机甲武器风格
    drawSkeleton(color, strokeWidth, stateTimer, currentState) {
        ctx.strokeStyle = color;
        ctx.lineWidth = strokeWidth;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';

        let headRadius = 12;
        let hipX = 0, hipY = -50;
        let neckX = 0, neckY = -90;
        
        let lShoulderX = -6, lShoulderY = -84, rShoulderX = 6, rShoulderY = -84;
        let lHandX = -16, lHandY = -58, rHandX = 16, rHandY = -58;
        let lFootX = -16, lFootY = 0, rFootX = 16, rFootY = 0;
        let lKneeX = -11, lKneeY = -25, rKneeX = 11, rKneeY = -25;
        let lElbowX = -11, lElbowY = -72, rElbowX = 11, rElbowY = -72;

        const t = stateTimer;

        if (currentState === 'idle') {
            let p = this.animPose; neckY += p * 3;
            rHandX = 16 + p * 2; rHandY = -64 + p * 3; lHandX = -14 - p * 2; lHandY = -64;
            // 呼吸微调腿部膝盖
            lKneeX -= p*1; rKneeX += p*1;
        } 
        else if (currentState === 'walk') {
            let p = Math.sin(this.animPose); let cosP = Math.cos(this.animPose);
            rFootX = p * 20; rFootY = Math.min(0, cosP * 9); lFootX = -p * 20; lFootY = Math.min(0, -cosP * 9);
            rHandX = -p * 15 + 6; lHandX = p * 15 - 6;
            rKneeX = rFootX*0.6 + 5; lKneeX = lFootX*0.6 - 5;
        }
        else if (currentState === 'block') {
            neckX = -8; rHandX = 16; rHandY = -94; lHandX = 10; lHandY = -86;
            // 绘制防守纳米电能光盾盾弧
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 255, 242, 0.4)'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(22, -65, 30, -Math.PI*0.4, Math.PI*0.4); ctx.stroke();
            ctx.restore();
        }
        else if (currentState === 'dash') {
            neckX = 20; neckY = -82; hipX = -12; rHandX = 35; lHandX = -25; rFootX = 26; lFootX = -30;
        }
        else if (currentState === 'punch') {
            // 出拳动作带有肩部前倾发力感
            neckX = 12; hipX = -4;
            // 前冲直拳轨迹
            rHandX = t < 4 ? 16 + t * 11 : 60 - (t-4) * 5; rHandY = -84;
            lHandX = -10; lHandY = -62;
            
            // 为爆炎拳手部附加蓄热高亮环
            if (this.type === 'crimson') {
                ctx.fillStyle = varColor('--neon-pink');
                ctx.beginPath(); ctx.arc(rHandX, rHandY, 6, 0, TWO_PI); ctx.fill();
            }
        }
        else if (currentState === 'kick') {
            neckX = -12; hipX = 8; lHandX = -22; lHandY = -45; rHandX = -5; rHandY = -88;
            if (t < 5) {
                rFootX = t * 14; rFootY = -45 - t * 8;
            } else {
                rFootX = 70 - (t-5) * 6; rFootY = -85 + (t-5) * 9;
            }
            rKneeX = rFootX * 0.5; rKneeY = rFootY * 0.5 - 15;
            
            // 疾风斩和影刃脚部附加极光斩击波视觉线
            ctx.save();
            ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.6;
            ctx.beginPath(); ctx.arc(0, -40, 65, -Math.PI*0.2, Math.PI*0.3); ctx.stroke();
            ctx.restore();
        }
        else if (currentState === 'jb') {
            neckY = -84; rHandX = 14; rHandY = -48; lHandX = -14; lHandY = -48;
            ctx.save();
            ctx.strokeStyle = this.color; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, -50, Math.max(8, 50 - (t * 2.5) % 50), 0, TWO_PI); ctx.stroke();
            ctx.restore();
        }
        else if (currentState === 'ult') {
            neckX = 24; rHandX = 55; rHandY = -80; lHandX = -30;
            // 斩幕华丽横切背景射线
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)'; ctx.lineWidth = 3;
            ctx.shadowBlur = 15; ctx.shadowColor = color;
            ctx.beginPath(); ctx.moveTo(-90, -80); ctx.lineTo(110, -80); ctx.stroke();
            ctx.restore();
        }
        else if (currentState === 'hit') {
            neckX = -18; neckY = -84; rHandX = -8; rHandY = -100; lHandX = -24; lHandY = -75; rFootX = 15;
        }
        else if (currentState === 'dead') {
            neckX = -25; neckY = -22; hipX = -10; hipY = -18; lHandX = -30; rHandX = 4; lFootX = -40; rFootX = 20;
        }

        // 绘制头部高阶电子复眼
        ctx.beginPath(); ctx.arc(neckX, neckY - headRadius, headRadius, 0, TWO_PI);
        ctx.fillStyle = color; ctx.fill(); ctx.stroke();
        
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(neckX + (currentState==='hit'?-3:3), neckY - headRadius - 2, 2.5, 0, TWO_PI); ctx.fill();

        // 绘制主干主骨架
        ctx.beginPath();
        ctx.moveTo(neckX, neckY); ctx.lineTo(hipX, hipY); // 脊椎
        ctx.moveTo(lShoulderX, lShoulderY); ctx.lineTo(lElbowX, lElbowY); ctx.lineTo(lHandX, lHandY); // 左手
        ctx.moveTo(rShoulderX, rShoulderY); ctx.lineTo(rElbowX, rElbowY); ctx.lineTo(rHandX, rHandY); // 右手
        ctx.moveTo(hipX, hipY); ctx.lineTo(lKneeX, lKneeY); ctx.lineTo(lFootX, lFootY); // 左腿
        ctx.moveTo(hipX, hipY); ctx.lineTo(rKneeX, rKneeY); ctx.lineTo(rFootX, rFootY); // 右腿
        ctx.stroke();
    }
}

// 辅助样式色调识别器
function varColor(varName) {
    return varName === '--neon-pink' ? '#ff007f' : '#00ffff';
}

// 高能战斗按键轮询器
function handleInputs() {
    if (!p1 || !p2) return;

    // ---- P1 控制层映射 ----
    if (p1.state !== 'dead' && p1.hp > 0) {
        if (['idle', 'walk', 'block', 'jb'].includes(p1.state)) {
            if (keys['s']) {
                p1.setState('block');
            } else if (keys['a']) {
                p1.vx = -p1.baseSpeed; p1.dir = -1; p1.setState('walk');
            } else if (keys['d']) {
                p1.vx = p1.baseSpeed; p1.dir = 1; p1.setState('walk');
            } else if (keys['l']) {
                p1.setState('jb');
            } else {
                p1.setState('idle');
            }

            if (keys['w'] && p1.y === GROUND_Y) p1.vy = -15.0;
            
            if (keys['j']) {
                p1.setState('punch');
                spawnSpecialProjectile(p1);
            }
            if (keys['k']) {
                p1.setState('kick');
                spawnSpecialProjectile(p1);
            }
            if (keys['i'] && p1.energy >= 100) { 
                p1.energy = 0; p1.setState('ult'); 
                triggerUltEffect(p1, p2); 
            }
        }
    }

    // ---- P2 本地玩家控制 / AI 智能逻辑切换区 ----
    if (p2.state !== 'dead' && p2.hp > 0) {
        if (p2.isControlled) {
            if (['idle', 'walk', 'block', 'jb'].includes(p2.state)) {
                if (keys['arrowdown']) {
                    p2.setState('block');
                } else if (keys['arrowleft']) {
                    p2.vx = -p2.baseSpeed; p2.dir = -1; p2.setState('walk');
                } else if (keys['arrowright']) {
                    p2.vx = p2.baseSpeed; p2.dir = 1; p2.setState('walk');
                } else if (keys['3']) {
                    p2.setState('jb');
                } else {
                    p2.setState('idle');
                }

                if (keys['arrowup'] && p2.y === GROUND_Y) p2.vy = -15.0;
                
                if (keys['1']) {
                    p2.setState('punch');
                    spawnSpecialProjectile(p2);
                }
                if (keys['2']) {
                    p2.setState('kick');
                    spawnSpecialProjectile(p2);
                }
                if (keys['4'] && p2.energy >= 100) { 
                    p2.energy = 0; p2.setState('ult'); 
                    triggerUltEffect(p2, p1); 
                }
            }
        } else {
            executeAIDecision();
        }
    }
}

// 修复发射物无限重叠Bug：引入独立状态拦截器
function spawnSpecialProjectile(char) {
    if (char.hasSpawnedProjectile) return; 
    
    if (char.type === 'crimson' && char.state === 'punch') {
        projectiles.push(new Projectile(char.x + char.dir * 45, char.y - 75, char.dir * 11, 0, '#ff007f', 'fireball', char.id));
        char.hasSpawnedProjectile = true;
    } else if (char.type === 'shadow' && char.state === 'kick') {
        projectiles.push(new Projectile(char.x + char.dir * 50, char.y - 55, char.dir * 13, 0, '#bd00ff', 'shuriken', char.id));
        char.hasSpawnedProjectile = true;
    }
}

function triggerUltEffect(attacker, defender) {
    triggerShake(12, 15);
    spawnParticle(attacker.x, attacker.y - 50, '#ffffff', 20, 10);
    
    if (attacker.type === 'gale') { 
        // 瞬身闪掠至敌人身后实施绝杀背刺
        attacker.x = defender.x - defender.dir * 70;
        attacker.dir = defender.dir;
    }
}

// 强化版高级决策AI
function executeAIDecision() {
    if (p1.state === 'dead' || p2.state === 'dead' || p2.state === 'hit') return;
    const dist = Math.abs(p2.x - p1.x);
    
    if (p2.state !== 'ult' && p2.state !== 'dash') {
        p2.dir = p2.x < p1.x ? 1 : -1;
    }

    if (['idle', 'walk', 'block'].includes(p2.state)) {
        // 战术性自适应格挡拦截：当P1出招且距离极近时，高概率触发格挡
        if ((p1.state === 'punch' || p1.state === 'kick' || p1.state === 'ult') && dist < 130 && Math.random() < 0.55) {
            p2.setState('block');
            return;
        }

        if (dist > 250) {
            // 远距离：几率聚能或快速突进逼近
            if (p2.energy < 100 && Math.random() < 0.02) {
                p2.setState('jb');
            } else {
                p2.vx = p2.dir * p2.baseSpeed; p2.setState('walk');
            }
        } else if (dist <= 250 && dist > 90) {
            if (Math.random() < 0.04) p2.setState('dash');
            else { p2.vx = p2.dir * p2.baseSpeed; p2.setState('walk'); }
        } else {
            // 贴身肉搏域：智能权重连携连招
            if (Math.random() < 0.09) {
                p2.setState(Math.random() > 0.4 ? 'punch' : 'kick');
                spawnSpecialProjectile(p2);
            } else if (Math.random() < 0.03) {
                p2.setState('block');
            } else {
                p2.setState('idle');
            }
        }

        // 奥义斩杀触发阈
        if (p2.energy >= 100 && dist < 220 && Math.random() < 0.15) {
            p2.energy = 0; p2.setState('ult'); triggerUltEffect(p2, p1);
        }
    }

    if (p2.state === 'jb' && (dist < 110 || p2.energy >= 100 || Math.random() < 0.02)) {
        p2.setState('idle');
    }
}

// 严密碰撞包围盒检测
function checkCollisions(attacker, defender) {
    if (attacker.hasHitPhysical || defender.state === 'dead') return;

    let isAttacking = false;
    let rangeX = 0, rangeY = 75;
    let damage = 0;
    let knockback = 0;
    let isUlt = false;

    if (attacker.state === 'punch' && attacker.stateTimer >= 3 && attacker.stateTimer <= 7) {
        isAttacking = true; rangeX = 60; damage = attacker.pDmg; knockback = 7;
    }
    else if (attacker.state === 'kick' && attacker.stateTimer >= 4 && attacker.stateTimer <= 10) {
        isAttacking = true; rangeX = 75; damage = attacker.kDmg; knockback = 13;
    }
    else if (attacker.state === 'ult' && attacker.stateTimer >= 2 && attacker.stateTimer <= 14) {
        isAttacking = true; rangeX = attacker.type === 'gale' ? 160 : 110; damage = 28; knockback = 22; isUlt = true;
    }

    if (!isAttacking) return;

    // 计算中心物理核心包围盒间距
    let actualDistX = Math.abs((attacker.x + attacker.dir * 30) - defender.x);
    let actualDistY = Math.abs(attacker.y - defender.y);

    if (actualDistX < rangeX && actualDistY < rangeY) {
        applyHit(attacker, defender, damage, knockback, isUlt);
    }
}

// 物理伤害应用及硬直定格
function applyHit(attacker, defender, damage, knockback, isUlt) {
    attacker.hasHitPhysical = true; // 锁定此次单招判定线
    let hitX = (attacker.x + defender.x) / 2;
    let hitY = attacker.y - 65;

    // 完美克制及破防判定机制
    if (defender.state === 'block' && !isUlt && attacker.type !== 'titan') {
        defender.vx = attacker.dir * (knockback * 0.35);
        defender.hp = Math.max(0, defender.hp - (damage * 0.15)); // 格挡大量减伤
        spawnParticle(hitX, hitY, '#00ffff', 8, 4);
        triggerShake(2, 6);
        return;
    }

    // 核心实际扣血
    defender.hp = Math.max(0, defender.hp - damage);
    
    // 连击暴气能量回馈系统
    if (attacker.state !== 'ult' && attacker.energy !== undefined) {
        attacker.energy = Math.min(100, attacker.energy + 14);
    }

    defender.setState('hit');
    defender.vx = attacker.dir * knockback;
    defender.vy = (knockback > 11 || isUlt) ? -7 : 0; // 浮空受击判定

    // 爆裂粒子视觉分级处理
    if (!isUlt) {
        spawnParticle(hitX, hitY, attacker.color, 12, 7);
        triggerShake(6, 10);
        hitFlashes.push({ x: hitX, y: hitY, r: 15, maxR: 45, alpha: 1.0 });
        hitStopFrames = 4; // 常规连击顿挫感
    } else {
        spawnParticle(hitX, hitY, '#ffffff', 40, 16);
        spawnParticle(hitX, hitY, attacker.color, 25, 11);
        triggerShake(18, 28);
        hitFlashes.push({ x: hitX, y: hitY, r: 25, maxR: 140, alpha: 1.0 });
        hitStopFrames = 18; // 大招定格时间，制造出强烈的击打震慑手感
    }
}

function checkProjectileCollisions() {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.update(timeScale);
        
        let target = p.owner === 'p1' ? p2 : p1;
        let shooter = p.owner === 'p1' ? p1 : p2;
        
        if (target && target.state !== 'dead') {
            let distX = Math.abs(p.x - target.x);
            let distY = Math.abs(p.y - (target.y - 50));
            if (distX < 35 && distY < 55) {
                p.alive = false;
                let damage = p.type === 'fireball' ? 12 : 8;
                applyHit(shooter, target, damage, 9, false);
            }
        }
        if (!p.alive) projectiles.splice(i, 1);
    }
}

// 绘制纯正的高阶超现实赛博朋克深邃视差空间
function drawCyberBackground() {
    let bgGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
    bgGrad.addColorStop(0, '#040408'); bgGrad.addColorStop(1, '#0e0b16');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    
    // 背景科技流线动态刷掠
    ctx.strokeStyle = 'rgba(0, 255, 242, 0.04)'; ctx.lineWidth = 1;
    cyberLines.forEach(line => {
        line.x -= line.speed * timeScale;
        if(line.x < -line.len) line.x = WIDTH + Math.random()*50;
        ctx.beginPath(); ctx.moveTo(line.x, line.y); ctx.lineTo(line.x + line.len, line.y); ctx.stroke();
    });

    // 巨型电子霓虹月轮天线
    let moonGrad = ctx.createRadialGradient(WIDTH/2, 140, 10, WIDTH/2, 140, 120);
    moonGrad.addColorStop(0, 'rgba(255, 0, 127, 0.08)');
    moonGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = moonGrad; ctx.beginPath(); ctx.arc(WIDTH / 2, 140, 120, 0, TWO_PI); ctx.fill();
    
    ctx.strokeStyle = 'rgba(255, 0, 127, 0.06)';
    ctx.beginPath(); ctx.arc(WIDTH / 2, 140, 80, 0, TWO_PI); ctx.stroke();
    ctx.restore();

    // 远景数字轮廓电子大厦视差组
    ctx.fillStyle = '#07070f';
    const buildings = [
        { x: 40, w: 100, h: 300 }, { x: 180, w: 140, h: 360 },
        { x: 400, w: 180, h: 240 }, { x: 660, w: 120, h: 410 }, { x: 840, w: 150, h: 310 }
    ];
    buildings.forEach(b => {
        ctx.fillRect(b.x, GROUND_Y - b.h, b.w, b.h);
        // 大厦科技数字荧光窗点
        ctx.fillStyle = 'rgba(0, 255, 242, 0.07)';
        if((Math.floor(globalTime/200) % 3) !== 0) {
            ctx.fillRect(b.x + b.w/2 - 10, GROUND_Y - b.h + 50, 20, 12);
            ctx.fillRect(b.x + 20, GROUND_Y - b.h + 100, 15, 12);
        }
        ctx.fillStyle = '#07070f';
    });

    // 终结技背景黑域闪光极化
    if ((p1 && p1.state === 'ult') || (p2 && p2.state === 'ult')) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0,0,WIDTH,HEIGHT);
    }

    // 地平分限界线
    ctx.strokeStyle = 'rgba(0, 255, 242, 0.4)'; ctx.lineWidth = 3;
    ctx.save(); ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff';
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(WIDTH, GROUND_Y); ctx.stroke();
    ctx.restore();

    // 地面透视数字网格线（Cyber Grid）
    ctx.strokeStyle = 'rgba(0, 255, 242, 0.08)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = -300; i <= WIDTH + 300; i += 60) {
        ctx.moveTo(i, GROUND_Y); 
        ctx.lineTo(WIDTH / 2 + (i - WIDTH / 2) * 1.8, HEIGHT); // 呈现向屏幕外放射的三维透视效果
    }
    ctx.stroke();
    
    // 水平延伸动态脉冲光流
    let gridPulseY = GROUND_Y + (globalTime * 0.08) % (HEIGHT - GROUND_Y);
    ctx.strokeStyle = 'rgba(255, 0, 127, 0.12)';
    ctx.beginPath(); ctx.moveTo(0, gridPulseY); ctx.lineTo(WIDTH, gridPulseY); ctx.stroke();

    // 经典地面高级倒影反射管线
    if (p1 && p2) {
        ctx.save();
        ctx.globalAlpha = 0.08;
        ctx.translate(0, GROUND_Y * 2);
        ctx.scale(1, -1); // 垂直反转镜像
        p1.drawSkeleton(p1.color, 4, p1.stateTimer, p1.state);
        p2.drawSkeleton(p2.color, 4, p2.stateTimer, p2.state);
        ctx.restore();
    }
}

// 粒子渲染与多重高斯模糊发光圆盘
function drawVFX(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    
    for (let i = hitFlashes.length - 1; i >= 0; i--) {
        let f = hitFlashes[i];
        f.r += (f.maxR - f.r) * 0.25 * dt; 
        f.alpha -= 0.07 * dt;
        if (f.alpha <= 0) { hitFlashes.splice(i, 1); continue; }
        
        let grad = ctx.createRadialGradient(f.x, f.y, f.r * 0.05, f.x, f.y, f.r);
        grad.addColorStop(0, `rgba(255,255,255,${f.alpha})`);
        grad.addColorStop(0.2, `rgba(0,255,242,${f.alpha * 0.8})`);
        grad.addColorStop(0.6, `rgba(255,0,127,${f.alpha * 0.3})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TWO_PI); ctx.fill();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; 
        p.life -= p.decay * dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.restore();
}

// 赛博倾斜模块机甲风格UI绘制管线

    let p2DisplayW = Math.max(0, 325 * (p2.displayHp / p2.maxHp));

    ctx.fillStyle = hpGrad2; ctx.fillRect(WIDTH - 40 - p2ActualW, 35, p2ActualW, 23);
    ctx.strokeStyle = 'rgba(255,0,85,0.4)'; ctx.lineWidth = 1.5; ctx.strokeRect(WIDTH - 365, 35, 325, 23);
    
    // P2 能量条
    ctx.fillStyle = '#10101a'; ctx.fillRect(WIDTH - 260, 64, 220, 7);
    ctx.fillStyle = p2.energy >= 100 ? 'rgba(255, 170, 0, Math.sin(globalTime*0.01)*0.4+0.6)' : '#ffaa00';
    ctx.fillRect(WIDTH - 40 - (220 * (p2.energy / 100)), 64, 220 * (p2.energy / 100), 7);

    // 文本标示描边
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Courier New';
    ctx.shadowBlur = 4; ctx.shadowColor = p1.color;
    ctx.fillText(p1.name, 42, 25);
    ctx.shadowColor = p2.color;
    ctx.textAlign = 'right'; ctx.fillText(p2.name, WIDTH - 42, 25); ctx.textAlign = 'left';
    ctx.shadowBlur = 0;

    // 终极奥义提示语
    if(p1.energy >= 100) { ctx.fillStyle = '#00ffff'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('⚡ SYSTEM: OVERDRIVE READY', 40, 86); }
    if(p2.energy >= 100) { ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('OVERDRIVE READY :SYSTEM ⚡', WIDTH - 40, 86); ctx.textAlign = 'left'; }

    // 全局胜负裁决判定
    if ((p1.hp <= 0 || p2.hp <= 0) && gameState === 'battle') {
        gameState = 'gameover';
        const winText = document.getElementById('winnerText');
        if (p2.hp <= 0 && p1.hp > 0) {
            winText.innerHTML = "SYSTEM OVERRIDE<br><span style='font-size:26px; color:var(--neon-cyan); text-shadow: 0 0 15px #00ffff;'>PLAYER 1 WINS!</span>";
        } else if (p1.hp <= 0 && p2.hp > 0) {
            winText.innerHTML = currentMode === 1 ? "HARDWARE CRASH<br><span style='font-size:26px; color:var(--neon-pink); text-shadow: 0 0 15px #ff007f;'>AI MAINFRAME WINS!</span>" : "SYSTEM OVERRIDE<br><span style='font-size:26px; color:var(--neon-pink); text-shadow: 0 0 15px #ff007f;'>PLAYER 2 WINS!</span>";
        } else {
            winText.innerHTML = "SYNCHRONIZED DEATH<br><span style='font-size:26px; color:#fff;'>DOUBLE KNOCKOUT</span>";
        }
        setTimeout(() => { switchMenu('gameOverScreen'); }, 1400);
    }
    ctx.restore();
}

// 核心主心跳时钟循环管线
function step(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let deltaMs = timestamp - lastTime;
    if (deltaMs > 100) deltaMs = 16.6; // 锁死极端掉帧下的物理穿透拉扯
    lastTime = timestamp;

    // 执行严格硬直判定，阻断这一帧的位移演算，保证受击动画的肉感
    if (hitStopFrames > 0) {
        hitStopFrames--;
        // 保持渲染，停止物理世界进度步进
        requestAnimationFrame(step);
        return;
    }

    let dt = deltaMs / 16.66;
    globalTime += deltaMs;
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    ctx.save();
    // 摄像机电子振幅抖动演算
    if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * shakeIntensity;
        let dy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(dx, dy); 
        shakeTime -= dt;
    }

    drawCyberBackground();

    if (gameState === 'battle' || gameState === 'gameover') {
        handleInputs();
        
        // 双向物理碰撞包围盒检测
        checkCollisions(p1, p2); checkCollisions(p2, p1);
        checkProjectileCollisions();

        p1.update(dt); p2.update(dt);
        
        p1.draw(); p2.draw();
        projectiles.forEach(p => p.draw());
    }

    drawVFX(dt);
    
    if (gameState === 'battle' || gameState === 'gameover') {
        drawGameUI();
    }

    ctx.restore();
    requestAnimationFrame(step);
}

// ---- 新增：移动移动端独立解耦多触点高速引擎 ----
function setupTouchLink(elementId, targetKey) {
    const btn = document.getElementById(elementId);
    if (!btn) return;

    // 当触点发生时，直接向全局按键映射池强制写入，并完美阻止原生视口缩放与滑动
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        keys[targetKey] = true;
    }, { passive: false });

    const endTouch = (e) => {
        e.preventDefault();
        keys[targetKey] = false;
    };
    btn.addEventListener('touchend', endTouch, { passive: false });
    btn.addEventListener('touchcancel', endTouch, { passive: false });
}

// 虚拟街机物理按键到战斗状态机的精密一键映射
setupTouchLink('vb-l', 'a');        // ◀ 左移
setupTouchLink('vb-r', 'd');        // ▶ 右移
setupTouchLink('vb-u', 'w');        // ▲ 跃空
setupTouchLink('vb-d', 's');        // ▼ 纳米防御
setupTouchLink('vb-punch', 'j');    // 拳
setupTouchLink('vb-kick', 'k');     // 踢
setupTouchLink('vb-charge', 'l');   // 聚能充能
setupTouchLink('vb-ult', 'i');      // 终结奥义

// 全力启动核心时钟
requestAnimationFrame(step);
</script>
