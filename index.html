<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>热血火柴人：无限激斗 CyberVer 2026</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #gameWrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 242, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #09090e;
        }
        /* UI覆盖层 */
        .overlay-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 7, 15, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
            transition: all 0.3s;
        }
        .overlay-menu.hidden { display: none; }
        .menu-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(45deg, #00ffff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0,255,255,0.3);
        }
        .btn {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px 35px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            margin: 10px;
            letter-spacing: 2px;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(0,255,255,0.1);
        }
        .btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 25px rgba(0,255,255,0.5);
        }
        .char-select-box {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .char-card {
            border: 2px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            width: 110px;
            background: rgba(255,255,255,0.02);
            transition: 0.2s;
        }
        .char-card:hover {
            border-color: #ff007f;
            transform: translateY(-5px);
        }
        .char-card.selected {
            border-color: #00ffff;
            background: rgba(0,255,255,0.1);
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        .char-name { font-weight: bold; margin-bottom: 5px; }
        .char-desc { font-size: 11px; color: #888; }
        #ctrlInfo {
            position: absolute;
            bottom: 15px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            letter-spacing: 1px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <!-- 主菜单界面 -->
        <div id="mainMenu" class="overlay-menu">
            <div class="menu-title">STICKMAN: CYBER INFINITY</div>
            <button class="btn" onclick="switchMenu('selectScreen')">START GAME</button>
        </div>

        <!-- 角色与模式选择界面 -->
        <div id="selectScreen" class="overlay-menu hidden">
            <div style="font-size: 20px; margin-bottom: 15px; color:#00ffff; letter-spacing:2px;">CHOOSE YOUR FIGHTER</div>
            <div class="char-select-box" id="p1SelectBox"></div>
            
            <div style="font-size: 20px; margin-bottom: 15px; color:#ff007f; letter-spacing:2px;">SELECT GAME MODE</div>
            <div style="display: flex;">
                <button class="btn" onclick="startGame(1)">1P vs AI (人机对战)</button>
                <button class="btn" style="border-color:#ff007f; color:#ff007f;" onclick="startGame(2)">1P vs 2P (双人对战)</button>
            </div>
        </div>

        <!-- 游戏结算界面 -->
        <div id="gameOverScreen" class="overlay-menu hidden">
            <div class="menu-title" id="winnerText">VICTORY!</div>
            <button class="btn" onclick="switchMenu('selectScreen')">PLAY AGAIN</button>
        </div>

        <div id="ctrlInfo">
            P1: [A/D]移动 | [W]跳跃 | [S]防守 | [J]拳 | [K]踢 | [L]蓄气 | [I]大招<br>
            P2: [方向键]移动/跳/防 | [1]拳 | [2]踢 | [3]蓄气 | [4]大招
        </div>
        <canvas id="battleCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById('battleCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 1024;
const HEIGHT = 576;
canvas.width = WIDTH;
canvas.height = HEIGHT;

const TWO_PI = Math.PI * 2;
const GROUND_Y = HEIGHT - 90;

// 核心游戏全局变量
let p1 = null;
let p2 = null;
let currentMode = 1; // 1: 1P vs AI, 2: 1P vs 2P
let gameState = 'menu'; // menu, select, battle, gameover

// 特效控制池
let shakeTime = 0, shakeIntensity = 0;
let globalTime = 0, timeScale = 1, bulletTimeTimer = 0, lastTime = 0;
let particles = [], hitFlashes = [], projectiles = [];

// 键盘监听输入核心
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 纵深角色属性配置库
const CHARACTER_ROSTER = {
    gale: { name: "白神 (疾风)", color: "#ffffff", trailColor: "rgba(255,255,255,0.15)", maxHp: 100, speed: 5.5, pDmg: 6, kDmg: 12, desc: "全能敏捷型，大招全屏斩" },
    crimson: { name: "红莲 (烈焰)", color: "#ff2a55", trailColor: "rgba(255,42,85,0.15)", maxHp: 100, speed: 4.5, pDmg: 5, kDmg: 10, desc: "中程法术型，拳脚附带火球" },
    shadow: { name: "影刃 (暗影)", color: "#bd00ff", trailColor: "rgba(189,0,255,0.15)", maxHp: 90, speed: 6.0, pDmg: 4, kDmg: 9, desc: "极速爆发型，踢腿射出手里剑" },
    titan: { name: "金刚 (重装)", color: "#ffaa00", trailColor: "rgba(255,170,0,0.15)", maxHp: 130, speed: 3.5, pDmg: 10, kDmg: 18, desc: "重装防御型，伤害极高带破防" }
};
let selectedP1Type = 'gale';

// 初始化角色选择卡片
const p1Box = document.getElementById('p1SelectBox');
Object.keys(CHARACTER_ROSTER).forEach((key) => {
    const char = CHARACTER_ROSTER[key];
    const card = document.createElement('div');
    card.className = `char-card ${key === selectedP1Type ? 'selected' : ''}`;
    card.onclick = () => {
        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedP1Type = key;
    };
    card.innerHTML = `<div class="char-name" style="color:${char.color}">${char.name}</div><div class="char-desc">${char.desc}</div>`;
    p1Box.appendChild(card);
});

function switchMenu(targetId) {
    document.querySelectorAll('.overlay-menu').forEach(m => m.classList.add('hidden'));
    document.getElementById(targetId).classList.remove('hidden');
    if (targetId === 'selectScreen') {
        gameState = 'select';
    }
}

function startGame(mode) {
    currentMode = mode;
    document.querySelectorAll('.overlay-menu').forEach(m => m.classList.add('hidden'));
    
    // 实例化P1与P2配置
    const p1Config = CHARACTER_ROSTER[selectedP1Type];
    const p2Types = Object.keys(CHARACTER_ROSTER);
    const p2Type = currentMode === 1 ? p2Types[Math.floor(Math.random() * p2Types.length)] : (selectedP1Type === 'gale' ? 'crimson' : 'gale');
    const p2Config = CHARACTER_ROSTER[p2Type];

    p1 = new Stickman(250, GROUND_Y, p1Config, 1, true, 'p1');
    p2 = new Stickman(774, GROUND_Y, p2Config, -1, currentMode === 2, 'p2');
    
    particles = []; hitFlashes = []; projectiles = [];
    gameState = 'battle';
}

// 粒子特效系统
function spawnParticle(x, y, color, count = 5, speed = 5) {
    if (particles.length > 400) return;
    for(let i = 0; i < count; i++) {
        const angle = Math.random() * TWO_PI;
        const s = Math.random() * speed + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * s,
            vy: Math.sin(angle) * s - Math.random() * 2,
            life: 1, decay: Math.random() * 0.03 + 0.02,
            color, size: Math.random() * 4 + 2
        });
    }
}

function triggerShake(intensity, duration) {
    shakeIntensity = intensity; shakeTime = duration;
}

// 远程弹幕类
class Projectile {
    constructor(x, y, vx, vy, color, type, owner) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.type = type; this.owner = owner; // owner = 'p1' / 'p2'
        this.alive = true; this.size = type === 'fireball' ? 12 : 6;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        if (this.x < 0 || this.x > WIDTH) this.alive = false;
        if (Math.random() > 0.4) {
            spawnParticle(this.x, this.y, this.color, 1, 1);
        }
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 15; ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        if (this.type === 'fireball') {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, TWO_PI);
            ctx.fill();
        } else { // 手里剑旋转样式
            ctx.translate(this.x, this.y);
            ctx.rotate(globalTime * 0.02);
            ctx.fillRect(-this.size, -this.size, this.size*2, this.size*2);
        }
        ctx.restore();
    }
}

// 火柴人格斗大师类
class Stickman {
    constructor(x, y, config, direction, isControlled, id) {
        this.id = id;
        this.x = x; this.y = y;
        this.name = config.name;
        this.type = Object.keys(CHARACTER_ROSTER).find(key => CHARACTER_ROSTER[key].name === config.name);
        this.color = config.color;
        this.trailColor = config.trailColor;
        this.maxHp = config.maxHp; this.hp = config.maxHp;
        this.baseSpeed = config.speed;
        this.pDmg = config.pDmg; this.kDmg = config.kDmg;
        this.dir = direction;
        this.isControlled = isControlled; // 属于手动控制还是AI控制
        
        this.energy = 0;
        this.state = 'idle'; // idle, walk, block, dash, punch, kick, jb, ult, hit, dead
        this.stateTimer = 0;
        this.hasHit = false;
        this.vx = 0; this.vy = 0;
        this.animPose = 0;
        this.history = []; // 用于高级残影视觉效果
    }

    update(dt) {
        const scaledDt = dt * timeScale;
        this.stateTimer += scaledDt;

        // 保存物理历史做动态流光残影
        this.history.push({x: this.x, y: this.y, state: this.state, timer: this.stateTimer});
        if(this.history.length > 6) this.history.shift();

        this.x += this.vx * scaledDt;
        this.y += this.vy * scaledDt;
        this.vx *= Math.pow(0.85, scaledDt);

        if (this.x < 40) this.x = 40;
        if (this.x > WIDTH - 40) this.x = WIDTH - 40;

        if (this.y < GROUND_Y) {
            this.vy += 0.75 * scaledDt;
        } else {
            this.y = GROUND_Y; this.vy = 0;
        }

        if (this.hp <= 0 && this.state !== 'dead') this.setState('dead');

        // 执行动作流
        switch(this.state) {
            case 'idle': this.animPose = Math.sin(globalTime * 0.007) * 0.5 + 0.5; break;
            case 'walk': this.animPose = globalTime * 0.012; break;
            case 'dash':
                this.vx = this.dir * 24;
                if(this.stateTimer > 7) this.setState('idle');
                break;
            case 'punch': if(this.stateTimer > 9) this.setState('idle'); break;
            case 'kick': if(this.stateTimer > 12) this.setState('idle'); break;
            case 'block': this.vx = -this.dir * 0.5; break;
            case 'jb':
                this.vx = -this.dir * 0.2;
                this.energy = Math.min(100, this.energy + 1.5 * scaledDt);
                break;
            case 'ult':
                if(this.type === 'gale') {
                    this.vx = this.dir * 45; // 狂暴一闪
                } else {
                    this.vx = this.dir * 12;
                }
                if(this.stateTimer > 15) this.setState('idle');
                break;
            case 'hit': if(this.stateTimer > 10) this.setState('idle'); break;
        }
    }

    setState(newState) {
        if (this.state === 'dead') return;
        this.state = newState; this.stateTimer = 0; this.hasHit = false;
    }

    drawTrails() {
        this.history.forEach((pos, idx) => {
            if (pos.state === 'dash' || pos.state === 'ult') {
                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.scale(this.dir, 1);
                ctx.globalAlpha = (idx / this.history.length) * 0.25;
                this.drawSkeleton(this.trailColor, 4, pos.timer, pos.state);
                ctx.restore();
            }
        });
        ctx.globalAlpha = 1.0;
    }

    draw() {
        this.drawTrails();

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.dir, 1);
        
        ctx.shadowBlur = (this.state === 'ult' || this.state === 'jb') ? 25 : 5;
        ctx.shadowColor = this.color;

        this.drawSkeleton(this.color, 5, this.stateTimer, this.state);
        ctx.restore();
    }

    drawSkeleton(color, strokeWidth, stateTimer, currentState) {
        ctx.strokeStyle = color;
        ctx.lineWidth = strokeWidth;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';

        let headRadius = 11;
        let hipX = 0, hipY = -48;
        let neckX = 0, neckY = -86;
        
        let lShoulderX = -5, lShoulderY = -80, rShoulderX = 5, rShoulderY = -80;
        let lHandX = -14, lHandY = -55, rHandX = 14, rHandY = -55;
        let lFootX = -14, lFootY = 0, rFootX = 14, rFootY = 0;
        let lKneeX = -10, lKneeY = -23, rKneeX = 10, rKneeY = -23;
        let lElbowX = -10, lElbowY = -70, rElbowX = 10, rElbowY = -70;

        const t = stateTimer;

        // 骨骼姿态计算层
        if (currentState === 'idle') {
            let p = this.animPose; neckY += p * 2;
            rHandX = 14 + p * 2; rHandY = -60 + p * 2; lHandX = -12 - p * 2; lHandY = -60;
        } 
        else if (currentState === 'walk') {
            let p = Math.sin(this.animPose); let cosP = Math.cos(this.animPose);
            rFootX = p * 16; rFootY = Math.min(0, cosP * 7); lFootX = -p * 16; lFootY = Math.min(0, -cosP * 7);
            rHandX = -p * 12 + 5; lHandX = p * 12 - 5;
        }
        else if (currentState === 'block') {
            neckX = -6; rHandX = 12; rHandY = -88; lHandX = 8; lHandY = -82;
        }
        else if (currentState === 'dash') {
            neckX = 16; neckY = -78; hipX = -10; rHandX = 30; lHandX = -20; rFootX = 22; lFootX = -25;
        }
        else if (currentState === 'punch') {
            neckX = 10; rHandX = t < 4 ? 12 + t * 9 : 48 - (t-4) * 4; rHandY = -82;
        }
        else if (currentState === 'kick') {
            neckX = -8; hipX = 5; lHandX = -18;
            if (t < 5) {
                rFootX = t * 11; rFootY = -40 - t * 7;
            } else {
                rFootX = 55 - (t-5) * 5; rFootY = -75 + (t-5) * 8;
            }
            rKneeX = rFootX / 2; rKneeY = rFootY / 2 - 12;
        }
        else if (currentState === 'jb') {
            neckY = -80; rHandX = 12; rHandY = -45; lHandX = -12; lHandY = -45;
            
            ctx.save();
            ctx.strokeStyle = this.color; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(0, -45, Math.max(5, 45 - (t * 2) % 45), 0, TWO_PI); ctx.stroke();
            ctx.restore();
        }
        else if (currentState === 'ult') {
            neckX = 20; rHandX = 45; rHandY = -75; lHandX = -25;
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-60, -75); ctx.lineTo(80, -75); ctx.stroke();
            ctx.restore();
        }
        else if (currentState === 'hit') {
            neckX = -15; neckY = -80; rHandX = -5; rHandY = -95; rFootX = 10;
        }
        else if (currentState === 'dead') {
            neckX = -20; neckY = -20; hipX = -8; hipY = -15; lHandX = -25; rHandX = 0; lFootX = -35; rFootX = 15;
        }

        // 画头
        ctx.beginPath(); ctx.arc(neckX, neckY - headRadius, headRadius, 0, TWO_PI);
        ctx.fillStyle = color; ctx.fill(); ctx.stroke();
        // 画躯干身形
        ctx.beginPath();
        ctx.moveTo(neckX, neckY); ctx.lineTo(hipX, hipY);
        ctx.moveTo(lShoulderX, lShoulderY); ctx.lineTo(lElbowX, lElbowY); ctx.lineTo(lHandX, lHandY);
        ctx.moveTo(rShoulderX, rShoulderY); ctx.lineTo(rElbowX, rElbowY); ctx.lineTo(rHandX, rHandY);
        ctx.moveTo(hipX, hipY); ctx.lineTo(lKneeX, lKneeY); ctx.lineTo(lFootX, lFootY);
        ctx.moveTo(hipX, hipY); ctx.lineTo(rKneeX, rKneeY); ctx.lineTo(rFootX, rFootY);
        ctx.stroke();
    }
}

function handleInputs() {
    if (!p1 || !p2) return;

    // ---- P1 玩家控制架构 ----
    if (p1.state !== 'dead' && p1.hp > 0) {
        if (p1.state === 'idle' || p1.state === 'walk' || p1.state === 'block') {
            if (keys['s']) {
                p1.setState('block');
            } else if (keys['a']) {
                p1.vx = -p1.baseSpeed; p1.dir = -1; p1.setState('walk');
            } else if (keys['d']) {
                p1.vx = p1.baseSpeed; p1.dir = 1; p1.setState('walk');
            } else {
                p1.setState('idle');
            }

            if (keys['w'] && p1.y === GROUND_Y) p1.vy = -14.5;
            if (keys['j']) {
                p1.setState('punch');
                if (p1.type === 'crimson') spawnSpecialProjectile(p1);
            }
            if (keys['k']) {
                p1.setState('kick');
                if (p1.type === 'shadow') spawnSpecialProjectile(p1);
            }
            if (keys['l']) p1.setState('jb');
            if (keys['i'] && p1.energy >= 100) { p1.energy = 0; p1.setState('ult'); triggerUltEffect(p1, p2); }
        }
        if (p1.state === 'jb' && !keys['l']) p1.setState('idle');
    }

    // ---- P2 控制层 ----
    if (p2.state !== 'dead' && p2.hp > 0) {
        if (p2.isControlled) {
            // 双人同屏：手动控制逻辑
            if (p2.state === 'idle' || p2.state === 'walk' || p2.state === 'block') {
                if (keys['arrowdown']) {
                    p2.setState('block');
                } else if (keys['arrowleft']) {
                    p2.vx = -p2.baseSpeed; p2.dir = -1; p2.setState('walk');
                } else if (keys['arrowright']) {
                    p2.vx = p2.baseSpeed; p2.dir = 1; p2.setState('walk');
                } else {
                    p2.setState('idle');
                }

                if (keys['arrowup'] && p2.y === GROUND_Y) p2.vy = -14.5;
                if (keys['1']) {
                    p2.setState('punch');
                    if (p2.type === 'crimson') spawnSpecialProjectile(p2);
                }
                if (keys['2']) {
                    p2.setState('kick');
                    if (p2.type === 'shadow') spawnSpecialProjectile(p2);
                }
                if (keys['3']) p2.setState('jb');
                if (keys['4'] && p2.energy >= 100) { p2.energy = 0; p2.setState('ult'); triggerUltEffect(p2, p1); }
            }
            if (p2.state === 'jb' && !keys['3']) p2.setState('idle');
        } else {
            // 单人游戏：自动化决策树
            executeAIDecision();
        }
    }
}

function spawnSpecialProjectile(char) {
    if(char.hasHit) return;
    if (char.type === 'crimson' && char.stateTimer < 2) {
        projectiles.push(new Projectile(char.x + char.dir*35, char.y - 70, char.dir*9, 0, '#ff4500', 'fireball', char.id));
        char.hasHit = true;
    } else if (char.type === 'shadow' && char.stateTimer < 2) {
        projectiles.push(new Projectile(char.x + char.dir*40, char.y - 50, char.dir*11, 0, '#bd00ff', 'shuriken', char.id));
        char.hasHit = true;
    }
}

function triggerUltEffect(attacker, defender) {
    if (attacker.type === 'gale') { // 疾风斩
        attacker.x = defender.x - defender.dir * 60;
        attacker.dir = defender.dir;
    }
}

// 自动化高级 AI 逻辑
function executeAIDecision() {
    if (p1.state === 'dead' || p2.state === 'dead' || p2.state === 'hit') return;
    const dist = Math.abs(p2.x - p1.x);
    
    // 自动锁定目标方向
    if (p2.state !== 'ult' && p2.state !== 'dash') {
        p2.dir = p2.x < p1.x ? 1 : -1;
    }

    if (p2.state === 'idle' || p2.state === 'walk' || p2.state === 'block') {
        // 应对玩家攻击进入防御状态
        if ((p1.state === 'punch' || p1.state === 'kick' || p1.state === 'ult') && dist < 120 && Math.random() < 0.4) {
            p2.setState('block');
            return;
        }

        if (dist > 220) {
            if (p2.energy < 100 && Math.random() < 0.015) {
                p2.setState('jb');
            } else {
                p2.vx = p2.dir * p2.baseSpeed; p2.setState('walk');
            }
        } else if (dist <= 220 && dist > 80) {
            if (Math.random() < 0.03) p2.setState('dash');
            else { p2.vx = p2.dir * p2.baseSpeed; p2.setState('walk'); }
        } else {
            // 近距离缠斗
            if (Math.random() < 0.08) {
                p2.setState(Math.random() > 0.5 ? 'punch' : 'kick');
                if (p2.type === 'crimson') spawnSpecialProjectile(p2);
                if (p2.type === 'shadow') spawnSpecialProjectile(p2);
            } else if (Math.random() < 0.02) {
                p2.setState('block');
            } else {
                p2.setState('idle');
            }
        }

        // 大招判定
        if (p2.energy >= 100 && dist < 200 && Math.random() < 0.1) {
            p2.energy = 0; p2.setState('ult'); triggerUltEffect(p2, p1);
        }
    }

    if (p2.state === 'jb' && (dist < 90 || p2.energy >= 100 || Math.random() < 0.03)) {
        p2.setState('idle');
    }
}

// 碰撞判定算法
function checkCollisions(attacker, defender) {
    if (attacker.hasHit || defender.state === 'dead') return;

    let isAttacking = false;
    let rangeX = 0, rangeY = 70;
    let damage = 0;
    let knockback = 0;
    let isUlt = false;

    if (attacker.state === 'punch' && attacker.stateTimer >= 3 && attacker.stateTimer <= 6) {
        isAttacking = true; rangeX = 55; damage = attacker.pDmg; knockback = 6;
    }
    else if (attacker.state === 'kick' && attacker.stateTimer >= 5 && attacker.stateTimer <= 9) {
        isAttacking = true; rangeX = 65; damage = attacker.kDmg; knockback = 12;
    }
    else if (attacker.state === 'ult' && attacker.stateTimer >= 3 && attacker.stateTimer <= 11) {
        isAttacking = true; rangeX = attacker.type === 'gale' ? 150 : 100; damage = 26; knockback = 20; isUlt = true;
    }

    if (!isAttacking) return;

    let actualDistX = Math.abs((attacker.x + attacker.dir * 25) - defender.x);
    let actualDistY = Math.abs(attacker.y - defender.y);

    if (actualDistX < rangeX && actualDistY < rangeY) {
        applyHit(attacker, defender, damage, knockback, isUlt);
    }
}

function applyHit(attacker, defender, damage, knockback, isUlt) {
    attacker.hasHit = true;
    let hitX = (attacker.x + defender.x) / 2;
    let hitY = attacker.y - 60;

    // 格挡防御防御结算机制
    if (defender.state === 'block' && !isUlt && attacker.type !== 'titan') {
        defender.vx = attacker.dir * (knockback * 0.4);
        defender.hp = Math.max(0, defender.hp - (damage * 0.15)); // 减免85%伤害
        spawnParticle(hitX, hitY, '#00ffff', 6, 4);
        triggerShake(2, 5);
        return;
    }

    // 正常受击流程
    defender.hp = Math.max(0, defender.hp - damage);
    if (attacker.state !== 'ult' && attacker.energy !== undefined) {
        attacker.energy = Math.min(100, attacker.energy + 12);
    }

    defender.setState('hit');
    defender.vx = attacker.dir * knockback;
    defender.vy = (knockback > 10 || isUlt) ? -6 : 0;

    // 爆发光效与时空减速
    if (!isUlt) {
        spawnParticle(hitX, hitY, attacker.color || '#ffffff', 10, 6);
        triggerShake(5, 8);
        hitFlashes.push({x: hitX, y: hitY, r: 15, maxR: 40, alpha: 1});
    } else {
        spawnParticle(hitX, hitY, '#ffffff', 35, 14);
        spawnParticle(hitX, hitY, attacker.color || '#ffffff', 20, 10);
        triggerShake(16, 25);
        hitFlashes.push({x: hitX, y: hitY, r: 30, maxR: 120, alpha: 1});
        
        // 子弹时间极速延时
        timeScale = 0.05; bulletTimeTimer = 200;
    }
}

// 弹幕投掷物碰撞判定机制
function checkProjectileCollisions() {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.update(timeScale);
        
        let target = p.owner === 'p1' ? p2 : p1;
        let shooter = p.owner === 'p1' ? p1 : p2;
        
        if (target && target.state !== 'dead') {
            let distX = Math.abs(p.x - target.x);
            let distY = Math.abs(p.y - (target.y - 50));
            if (distX < 30 && distY < 50) {
                p.alive = false;
                let damage = p.type === 'fireball' ? 10 : 7;
                applyHit(shooter, target, damage, 8, false);
            }
        }
        if (!p.alive) projectiles.splice(i, 1);
    }
}

// 绘制全新赛博视差背景
function drawCyberBackground() {
    // 深空渐变
    let bgGrad = ctx.createRadialGradient(WIDTH/2, HEIGHT/2, 50, WIDTH/2, HEIGHT/2, WIDTH);
    bgGrad.addColorStop(0, '#11111b'); bgGrad.addColorStop(1, '#040407');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.save();
    ctx.shadowBlur = 40; ctx.shadowColor = 'rgba(0, 255, 255, 0.2)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.beginPath(); ctx.arc(WIDTH / 2, 160, 110, 0, TWO_PI); ctx.fill();
    ctx.restore();

    // 建筑群
    ctx.fillStyle = '#0b0b12';
    const buildings = [
        {x: 60, w: 90, h: 280}, {x: 200, w: 120, h: 340},
        {x: 420, w: 150, h: 220}, {x: 640, w: 100, h: 390}, {x: 820, w: 130, h: 290}
    ];
    buildings.forEach(b => {
        ctx.fillRect(b.x, HEIGHT - b.h, b.w, b.h);
        ctx.fillStyle = 'rgba(0, 255, 255, 0.08)';
        if(Math.random() > 0.1) ctx.fillRect(b.x + b.w/3, HEIGHT - b.h + 40, b.w/4, 15);
        ctx.fillStyle = '#0b0b12';
    });

    // 流光速度线
    if ((p1 && p1.state === 'ult') || (p2 && p2.state === 'ult') || shakeTime > 10) {
        ctx.strokeStyle = 'rgba(255, 0, 127, 0.1)'; ctx.lineWidth = 2;
        ctx.beginPath();
        for(let i=0; i<5; i++) {
            let ry = (globalTime + i*100) % HEIGHT;
            ctx.moveTo(0, ry); ctx.lineTo(WIDTH, ry);
        }
        ctx.stroke();
    }

    // 地面发光网格
    ctx.strokeStyle = 'rgba(0, 255, 242, 0.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(WIDTH, GROUND_Y); ctx.stroke();

    // 安全保护卫语句：只有在人物成功实例化后，才绘制高级倒影
    if (p1 && p2) {
        ctx.save();
        ctx.globalAlpha = 0.06;
        ctx.translate(0, GROUND_Y * 2);
        ctx.scale(1, -1);
        // 精准映射倒影姿态而不再渲染硬编码方块
        p1.drawSkeleton(p1.color, 4, p1.stateTimer, p1.state);
        p2.drawSkeleton(p2.color, 4, p2.stateTimer, p2.state);
        ctx.restore();
    }

    // 地面透视线
    ctx.strokeStyle = 'rgba(0, 255, 242, 0.06)';
    ctx.beginPath();
    for (let i = -200; i <= WIDTH + 200; i += 50) {
        ctx.moveTo(i, GROUND_Y); ctx.lineTo(i + (i - WIDTH / 2) * 0.6, HEIGHT);
    }
    ctx.stroke();
}

function drawVFX(dt) {
    const scaledDt = dt * timeScale;
    // 打击光圈
    for (let i = hitFlashes.length - 1; i >= 0; i--) {
        let f = hitFlashes[i];
        f.r += (f.maxR - f.r) * 0.3 * dt; f.alpha -= 0.08 * dt;
        if (f.alpha <= 0) { hitFlashes.splice(i, 1); continue; }
        
        ctx.save();
        let grad = ctx.createRadialGradient(f.x, f.y, f.r*0.1, f.x, f.y, f.r);
        grad.addColorStop(0, `rgba(255,255,255,${f.alpha})`);
        grad.addColorStop(0.3, `rgba(0,255,242,${f.alpha*0.6})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TWO_PI); ctx.fill();
        ctx.restore();
    }

    // 散落粒子爆发迭代
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * scaledDt; p.y += p.vy * scaledDt; p.life -= p.decay * scaledDt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.save();
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.restore();
    }
}

// 界面顶层数据仪表盘
function drawGameUI() {
    if (!p1 || !p2) return;

    // P1 状态槽（左侧霓虹蓝）
    ctx.fillStyle = '#14141f'; ctx.fillRect(50, 35, 320, 20);
    let p1HpW = Math.max(0, 320 * (p1.hp / p1.maxHp));
    let hpGrad1 = ctx.createLinearGradient(50, 0, 370, 0); hpGrad1.addColorStop(0, '#00aaff'); hpGrad1.addColorStop(1, '#00ffff');
    ctx.fillStyle = hpGrad1; ctx.fillRect(50, 35, p1HpW, 20);
    ctx.strokeStyle = 'rgba(0,255,255,0.3)'; ctx.strokeRect(50, 35, 320, 20);
    
    ctx.fillStyle = '#14141f'; ctx.fillRect(50, 62, 200, 6);
    ctx.fillStyle = '#bd00ff'; ctx.fillRect(50, 62, 200 * (p1.energy / 100), 6);

    // P2 状态槽（右侧霓虹红）
    ctx.fillStyle = '#14141f'; ctx.fillRect(WIDTH - 370, 35, 320, 20);
    let p2HpW = Math.max(0, 320 * (p2.hp / p2.maxHp));
    let hpGrad2 = ctx.createLinearGradient(WIDTH - 370, 0, WIDTH - 50, 0); hpGrad2.addColorStop(0, '#ff0055'); hpGrad2.addColorStop(1, '#ff7700');
    ctx.fillStyle = hpGrad2; ctx.fillRect(WIDTH - 50 - p2HpW, 35, p2HpW, 20);
    ctx.strokeStyle = 'rgba(255,0,85,0.3)'; ctx.strokeRect(WIDTH - 370, 35, 320, 20);
    
    ctx.fillStyle = '#14141f'; ctx.fillRect(WIDTH - 250, 62, 200, 6);
    ctx.fillStyle = '#ffaa00'; ctx.fillRect(WIDTH - 50 - (200 * (p2.energy / 100)), 62, 200 * (p2.energy / 100), 6);

    // 文字标识
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
    ctx.fillText(p1.name, 50, 26);
    ctx.textAlign = 'right'; ctx.fillText(p2.name, WIDTH - 50, 26); ctx.textAlign = 'left';

    if(p1.energy >= 100) { ctx.fillStyle = '#00ffff'; ctx.font = '11px sans-serif'; ctx.fillText('👉 ULTIMATE READY [I]', 50, 82); }
    if(p2.energy >= 100) { ctx.fillStyle = '#ffaa00'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('ULTIMATE READY 👈', WIDTH - 50, 82); ctx.textAlign = 'left'; }

    // 终结决胜清算判定
    if ((p1.hp <= 0 || p2.hp <= 0) && gameState === 'battle') {
        gameState = 'gameover';
        const winText = document.getElementById('winnerText');
        if (p2.hp <= 0) {
            winText.innerHTML = "VICTORY<br><span style='font-size:24px; color:#00ffff;'>PLAYER 1 WINS!</span>";
        } else {
            winText.innerHTML = currentMode === 1 ? "DEFEAT<br><span style='font-size:24px; color:#ff0055;'>AI BOT WINS!</span>" : "VICTORY<br><span style='font-size:24px; color:#ff0055;'>PLAYER 2 WINS!</span>";
        }
        setTimeout(() => { switchMenu('gameOverScreen'); }, 1000);
    }
}

// 主循环引擎环
function step(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let deltaMs = timestamp - lastTime;
    if (deltaMs > 100) deltaMs = 16.6;
    let dt = deltaMs / 16.66;
    lastTime = timestamp;

    // 恢复时空减速子弹时间
    if (bulletTimeTimer > 0) {
        bulletTimeTimer -= deltaMs;
        if (bulletTimeTimer <= 0) timeScale = 1;
    }

    globalTime += deltaMs;
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    ctx.save();
    // 震颤矩阵介入
    if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * shakeIntensity;
        let dy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(dx, dy); shakeTime -= dt;
    }

    // 绘制背景
    drawCyberBackground();

    if (gameState === 'battle' || gameState === 'gameover') {
        handleInputs();
        
        // 交叉碰撞矩阵判定
        checkCollisions(p1, p2); checkCollisions(p2, p1);
        checkProjectileCollisions();

        p1.update(dt); p2.update(dt);
        
        // 实体渲染
        p1.draw(); p2.draw();
        projectiles.forEach(p => p.draw());
    }

    // 独立光效与UI层顶置
    drawVFX(dt);
    if (gameState === 'battle' || gameState === 'gameover') {
        drawGameUI();
    }

    ctx.restore();
    requestAnimationFrame(step);
}

// 激活心跳时钟
requestAnimationFrame(step);
</script>
